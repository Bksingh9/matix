# The checks that need no credentials. Everything here runs on every push.
#
# Deliberately included: verify:sql, which applies the migrations to a real
# Postgres and proves row-level security holds. It is the check verify:rls
# could never be, because that one needs a live Supabase project and so in
# practice never ran.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run verify:sql
        env:
          PSQL: psql -U postgres -h localhost
          PGPASSWORD: postgres

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
      - run: npm ci
      # The project once could not build at all for two phases running,
      # because nobody had run gradlew. See docs/DEVIATIONS.md.
      - run: npm run verify:android
