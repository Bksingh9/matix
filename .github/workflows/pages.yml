# Publish the playable build to GitHub Pages.
#
# This is the free tier of the plan in MONETISATION_PLAN.md: a real URL people
# can play on before any of the paid rails exist. There is no backend here, so
# the client runs anonymous and local-only — which it already knows how to do,
# and which never grants Pro.
#
# Point it at a real backend by setting the API_ORIGIN repository variable to
# a deployed Vercel origin; leave it unset for the anonymous demo.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/mindsharp-product-spec-tcsksb]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; finish the running one rather than cancelling,
# so a half-uploaded artifact is not what ends up live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # A broken build must not reach a URL people are looking at.
      - run: npm ci
      - run: npm run check

      - id: pages
        uses: actions/configure-pages@v5
        with:
          # Create the Pages site if it does not exist yet, instead of failing
          # and waiting for someone to click Settings -> Pages. The workflow
          # already holds pages: write, which is exactly the permission that
          # call needs.
          enablement: true

      # No base path needed: every asset path in public/ is relative, so the
      # same build runs at a domain root or under /<repo>/ unchanged.
      - name: Build static site
        run: node scripts/build-static.mjs --api="${{ vars.API_ORIGIN }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # deploy-pages@v4 requires the github-pages environment; without it the
    # deploy is rejected before it starts.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Play the deployed site in a real browser. The e2e suite proves the code
  # works against a local server; this proves the thing people actually visit
  # works, which is a different claim and the one that catches a bad deploy —
  # a missing asset, a wrong base path, a service worker serving a stale shell.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Pages serves the new commit a moment after the API reports success.
      - run: sleep 15
      - run: node scripts/smoke-live.mjs "${{ needs.deploy.outputs.url }}"
